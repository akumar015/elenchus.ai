services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - PORT=8000
      - CORS_ORIGINS=*
    env_file:
      - .env
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
